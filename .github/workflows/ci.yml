name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Production dependency audit (high and critical fail the build)
        run: npm run audit:prod

  rls:
    name: RLS tenant-isolation + Postgres repo contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: bash supabase/tests/run-rls-tests.sh
      - name: Repo + domain (RAID, sprints, gates, deliverables) contract suites against Postgres + RLS
        run: bash supabase/tests/run-contract-tests.sh

  e2e:
    name: Playwright smoke + accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build (with dummy server secrets, so a leaked value would be caught)
        run: npm run build
        env:
          RESEND_API_KEY: re_ci_dummy_resend_key_0001
          ANTHROPIC_API_KEY: sk-ant-ci-dummy-anthropic-0001
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key-0001
          REAUTH_SECRET: ci-dummy-reauth-secret-0000000000000001
          ICS_SECRET: ci-dummy-ics-secret-00000000000000000001
          CRON_SECRET: ci-dummy-cron-secret-0001
      - name: No server secrets in client bundles
        run: npm run check:bundle-secrets
        env:
          RESEND_API_KEY: re_ci_dummy_resend_key_0001
          ANTHROPIC_API_KEY: sk-ant-ci-dummy-anthropic-0001
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key-0001
          REAUTH_SECRET: ci-dummy-reauth-secret-0000000000000001
          ICS_SECRET: ci-dummy-ics-secret-00000000000000000001
          CRON_SECRET: ci-dummy-cron-secret-0001
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
